services:
  # 1. Blackboard Shared State Engine
  blackboard-redis:
    image: redis:7.2-alpine
    container_name: devpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 2. DevPilot Web Backend & Frontend Dashboard
  devpilot-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: devpilot-web
    environment:
      - BLACKBOARD_BACKEND=redis
      - REDIS_HOST=blackboard-redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - A2A_TOKEN=${A2A_TOKEN:-devpilot-local-a2a}
      - A2A_WORKER_URL=http://adk-workers:8484/rpc
      - SANDBOX_BROKER_URL=http://sandbox-broker:8750
      - SANDBOX_BROKER_TOKEN=${SANDBOX_BROKER_TOKEN:-devpilot-local-broker}
    volumes:
      - uploads:/app/devpilot_uploads
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro
    ports:
      - "8000:8000"
    depends_on:
      - blackboard-redis
      - adk-workers
      - sandbox-broker
    restart: unless-stopped

  # 3. A2A Protocol Gateway & Google ADK Workers
  adk-workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile.workers
    container_name: devpilot-adk-workers
    environment:
      - BLACKBOARD_BACKEND=redis
      - REDIS_HOST=blackboard-redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - A2A_TOKEN=${A2A_TOKEN:-devpilot-local-a2a}
    volumes:
      - uploads:/app/devpilot_uploads
      - ../src:/app/src:ro
      - ../config:/app/config:ro
    depends_on:
      - blackboard-redis
    restart: unless-stopped

  sandbox-broker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.broker
    environment:
      - SANDBOX_BROKER_TOKEN=${SANDBOX_BROKER_TOKEN:-devpilot-local-broker}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_jobs:/jobs
    security_opt:
      - no-new-privileges:true
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      cpp-sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

  sandbox-image:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    image: devpilot-sandbox:latest
    command: ["python", "-c", "print('Sandbox image ready')"]

  cpp-sandbox-image:
    build:
      context: ..
      dockerfile: Dockerfile.cpp
    image: devpilot-cpp-sandbox:latest
    command: ["python", "-c", "print('C++ sandbox image ready')"]

volumes:
  redis_data:
  uploads:
  sandbox_jobs:
    name: devpilot_sandbox_jobs
