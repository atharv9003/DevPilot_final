version: '3.8'

services:
  # 1. Blackboard Shared State Engine
  blackboard-redis:
    image: redis:7.2-alpine
    container_name: devpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 2. DevPilot Web Backend & Frontend Dashboard
  devpilot-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: devpilot-web
    environment:
      - BLACKBOARD_BACKEND=redis
      - REDIS_HOST=blackboard-redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - blackboard-redis
    restart: unless-stopped

  # 3. A2A Protocol Gateway & Google ADK Workers
  adk-workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile.workers
    container_name: devpilot-adk-workers
    environment:
      - BLACKBOARD_BACKEND=redis
      - REDIS_HOST=blackboard-redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    ports:
      - "8484:8484"
    depends_on:
      - blackboard-redis
    restart: unless-stopped

volumes:
  redis_data:
