[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot"
version = "0.1.0"
description = "DevPilot: A Multi-Agent Autonomous Code Review and Debugging System"
authors = [{ name = "DevPilot Team" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "crewai>=0.28.0",
    "redis>=5.0.0",
    "chromadb>=0.4.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyrefly]
search-path = [
    ".",
    "src"
]
site-package-path = [
    "C:\\Users\\jaina\\AppData\\Roaming\\Python\\Python312\\site-packages",
    "C:\\Program Files\\Python312\\Lib\\site-packages"
]
disable-search-path-heuristics = true



